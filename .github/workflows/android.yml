name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npm ci
          npm run build

      - name: Create Android project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Unlock the signing key (so updates install over the old app)
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then echo "::error::Add the KEYSTORE_PASS secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          mkdir -p ~/.android
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in ci/signing.keystore.enc -out ~/.android/debug.keystore -pass env:KEYSTORE_PASS
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../BakeryJobCards.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BakeryJobCards-apk
          path: BakeryJobCards.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bakery Job Cards 1.0.${{ github.run_number }}
          body: "Download BakeryJobCards.apk below and open it on the phone to install or update."
          files: BakeryJobCards.apk
          make_latest: true

      - name: Publish the update for phones
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-update.mjs
