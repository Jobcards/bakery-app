<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bakery Tech Job Cards</title>
<meta name="theme-color" content="#1B5FAA">
<link rel="stylesheet" href="fonts.css">
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script src="firebase-config.js"></script>
<script src="vendor.js"></script>
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body>
<style>
/* Layout: one-column phone tool — sticky header with tabs, card list, full-screen form, floating "New" button */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#141A21; --muted:#5B6673; --line:#D9DFE5;
  --accent:#1B5FAA; --accent-ink:#FFFFFF; --accent-soft:#E3EDF8;
  --ok:#1E7A46; --ok-soft:#E1F2E8; --warn:#A35F00; --warn-soft:#FBEED9; --wait:#6A3FB0; --wait-soft:#EEE7F8; --open:#5B6673; --open-soft:#E8ECF0;
  --danger:#B42318;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1419; --surface:#18202A; --ink:#E8EDF2; --muted:#98A4B1; --line:#2B3643;
  --accent:#5C9EE8; --accent-ink:#0B1520; --accent-soft:#1C2F45;
  --ok:#5CC98A; --ok-soft:#173826; --warn:#F0B35A; --warn-soft:#3A2A12; --wait:#B596EE; --wait-soft:#2C2340; --open:#98A4B1; --open-soft:#243040;
  --danger:#F2867D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1419; --surface:#18202A; --ink:#E8EDF2; --muted:#98A4B1; --line:#2B3643;
  --accent:#5C9EE8; --accent-ink:#0B1520; --accent-soft:#1C2F45;
  --ok:#5CC98A; --ok-soft:#173826; --warn:#F0B35A; --warn-soft:#3A2A12; --wait:#B596EE; --wait-soft:#2C2340; --open:#98A4B1; --open-soft:#243040;
  --danger:#F2867D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.brand{min-width:0}
.brand-row{display:flex;align-items:center;gap:10px;min-width:0}
#coLogo{height:40px;width:auto;max-width:110px;object-fit:contain;flex:none}
.logo-box{display:flex;align-items:center;justify-content:center;min-height:90px;background:#FFFFFF;border:1px dashed var(--line);border-radius:8px;padding:10px}
.logo-box img{max-height:80px;width:auto}
.brand h1{font-family:var(--f-display);font-size:1.5rem;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
.sync{text-transform:none!important;letter-spacing:0!important}
.sync.ok{color:var(--ok)!important}.sync.wait{color:var(--warn)!important}
.brand small{display:block;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font:600 .95rem var(--f-body);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{min-height:40px;padding:0 12px;font-size:.9rem}
main{padding-block:16px 120px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{min-width:0}
.search{flex:1 1 200px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.card .m{grid-column:1/-1;color:var(--muted);font-size:.88rem;display:flex;gap:4px 12px;flex-wrap:wrap}
.mono{font-family:var(--f-mono);font-size:.85em;font-variant-numeric:tabular-nums}
.pill{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;white-space:nowrap;align-self:start}
.s-done{background:var(--ok-soft);color:var(--ok)} .s-follow{background:var(--warn-soft);color:var(--warn)} .s-parts{background:var(--wait-soft);color:var(--wait)} .s-open{background:var(--open-soft);color:var(--open)}
.thumbs-mini{display:flex;gap:4px;grid-column:1/-1}
.thumbs-mini img{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--f-display);color:var(--ink);margin:0 0 6px;font-size:1.4rem}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;min-height:56px;padding:0 22px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.22);font-size:1rem}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
legend{font-family:var(--f-display);font-size:1.15rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:0;margin-bottom:4px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted);min-width:0}
label input,label select,label textarea{font-weight:400;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
textarea{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2.stack-sm{grid-template-columns:1fr}}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph input{border:0;border-top:1px solid var(--line);border-radius:0;padding:8px;font-size:.85rem;min-height:36px;background:var(--surface)}
.ph .x{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:1.1rem;cursor:pointer}
.ph .up{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-weight:600;font-size:.85rem}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted);font-size:.85rem}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.detail h2{font-family:var(--f-display);font-size:1.7rem;margin:0;line-height:1.1;text-wrap:balance}
.block h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 4px}
.block p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery figure{margin:0}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.gallery figcaption{font-size:.85rem;color:var(--muted);margin-top:2px}
.part{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.part .pd{min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.part .pd b{display:block;overflow-wrap:anywhere}
.part .pd span{color:var(--muted);font-size:.85rem}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:1.2rem;font-weight:600;cursor:pointer}
.qty output{min-width:2.4ch;text-align:center;font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.used{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.used li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px}
.used li span{min-width:0;overflow-wrap:anywhere}
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.brands .bl{position:relative;background:#FFFFFF;border:1px solid var(--line);border-radius:8px;height:64px;display:grid;place-items:center;padding:6px}
.brands .bl img{max-height:50px;width:auto}
.brands .bl .x{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.confirm{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s,background .15s}}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand-row"><img id="coLogo" alt="" hidden><div class="brand"><small id="coName">Service department</small><h1>Bakery Tech Job Cards</h1><small id="syncState" class="sync"></small></div></div>
      <button class="btn icon-btn" id="settingsBtn" type="button" aria-label="Company settings">Settings</button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabList" aria-selected="true" type="button">Job cards</button>
      <button class="tab" role="tab" id="tabVan" aria-selected="false" type="button">Van stock</button>
      <button class="tab" role="tab" id="tabReports" aria-selected="false" type="button">Reports</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<button class="btn primary fab" id="fab" type="button">+ New job card</button>
<div class="toast" id="toast" hidden></div>

<script>
const STATUSES={open:{label:"Open",cls:"s-open"},done:{label:"Completed",cls:"s-done"},follow:{label:"Follow-up needed",cls:"s-follow"},parts:{label:"Awaiting parts",cls:"s-parts"}};
const EQUIP=["Deck oven","Rack oven","Convection oven","Combi oven","Rotary oven","Proofer","Retarder-proofer","Spiral mixer","Planetary mixer","Dough divider","Moulder","Dough sheeter","Bread slicer","Fryer","Bakery refrigeration"];
const S={view:"list",cards:[],loaded:false,error:null,filter:"all",q:"",detailId:null,form:null,confirmDel:false,company:{name:"",footer:"",logoId:"",logoUrl:"",brandLogos:[]},logoDraft:null,brandDraft:null,vans:{},vanTech:null,vanQ:"",partForm:null,techs:[],names:{},
  rep:{from:"",to:"",tech:"all"}};
let db=null,assets=null,meId=null,canWrite=true,syncMode="local";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toLocaleDateString("en-CA");
const fmtDate=d=>{if(!d)return"";const [y,m,dd]=d.split("-");return `${dd}/${m}/${y}`};
function hours(a,b){if(!a||!b)return null;const [h1,m1]=a.split(":").map(Number),[h2,m2]=b.split(":").map(Number);let m=(h2*60+m2)-(h1*60+m1);if(m<0)m+=1440;return Math.round(m/6)/10}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function techName(id){return (id&&S.names[id])||"Technician"}
function newJobNo(){const d=new Date();const p=n=>String(n).padStart(2,"0");return `JC-${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`}

/* ---------- rendering ---------- */
function setTab(v){$("#tabList").setAttribute("aria-selected",v==="list"||v==="detail");$("#tabVan").setAttribute("aria-selected",v==="van");$("#tabReports").setAttribute("aria-selected",v==="reports")}
function render(){
  setTab(S.view);
  $("#fab").hidden=!(S.view==="list"||S.view==="detail")||!canWrite;
  $("#coName").textContent=S.company.name||"Service department";setLogo();
  const app=$("#app");
  if(S.view==="list")app.innerHTML=listView();
  else if(S.view==="van")app.innerHTML=vanView();
  else if(S.view==="detail")app.innerHTML=detailView();
  else if(S.view==="reports")app.innerHTML=reportsView();
  else if(S.view==="settings")app.innerHTML=settingsView();
  else if(S.view==="form"){app.innerHTML=formView();bindForm()}
  else if(S.view==="who")app.innerHTML=whoView();
  hydrate();window.scrollTo(0,0);
}
function statusPill(s){const st=STATUSES[s]||STATUSES.open;return `<span class="pill ${st.cls}">${st.label}</span>`}
function photoUrl(p){return blobSrc(p.id)}
function imgSrc(id){const u=blobSrc(id);return u?`src="${esc(u)}"`:`data-blob="${esc(id||"")}"`}
function filtered(){
  const q=S.q.trim().toLowerCase();
  return S.cards.filter(c=>(S.filter==="all"||c.status===S.filter)&&(!q||[c.jobNo,c.customer,c.site,c.equipment,c.model,c.serial,c.fault,techName(c.techId)].join(" ").toLowerCase().includes(q)));
}
function listView(){
  const banner=S.error?`<div class="banner">${esc(S.error)}</div>`:"";
  const chips=[["all","All"],...Object.entries(STATUSES).map(([k,v])=>[k,v.label])].map(([k,l])=>`<button type="button" class="chip" data-filter="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join("");
  let body;
  if(!S.loaded&&!S.error)body=`<div class="empty"><h2>Loading job cards…</h2><p>Fetching the team's cards.</p></div>`;
  else if(!S.cards.length)body=`<div class="empty"><h2>No job cards yet</h2><p>Each card holds the site, machine, fault, work done, parts and photos.<br>Tap <b>+ New job card</b> to log the first job.</p></div>`;
  else{const f=filtered();body=f.length?f.map(c=>`<button type="button" class="card" data-open="${esc(c.id)}">
      <span class="t">${esc(c.customer||"No customer")}${c.site?` · ${esc(c.site)}`:""}</span>${statusPill(c.status)}
      <span class="m"><span class="mono">${esc(c.jobNo)}</span><span>${fmtDate(c.date)}</span><span>${esc(c.equipment||"")}</span><span>${esc(techName(c.techId))}</span>${c.photos?.length?`<span>${c.photos.length} photo${c.photos.length>1?"s":""}</span>`:""}</span>
      ${c.photos?.length?`<span class="thumbs-mini">${c.photos.slice(0,4).map(p=>`<img ${imgSrc(p.id)} alt="">`).join("")}</span>`:""}
    </button>`).join(""):`<div class="empty"><p>No cards match this search.</p></div>`}
  return `<div class="stack">${banner}<div class="row"><input class="search" id="q" type="search" placeholder="Search job no, customer, serial…" value="${esc(S.q)}" aria-label="Search job cards"></div><div class="chips">${chips}</div>${body}</div>`;
}
function detailView(){
  const c=S.cards.find(x=>x.id===S.detailId);
  if(!c)return `<div class="empty"><p>This job card was removed.</p><button class="btn" data-go="list" type="button">Back to job cards</button></div>`;
  const h=hours(c.timeIn,c.timeOut);
  const blk=(t,v)=>v?`<div class="block"><h3>${t}</h3><p>${esc(v)}</p></div>`:"";
  const del=S.confirmDel?`<div class="confirm"><b>Delete job card ${esc(c.jobNo)}?</b><span class="hint">This removes it for the whole team.</span><div class="row"><button class="btn danger" id="delYes" type="button">Delete</button><button class="btn" id="delNo" type="button">Keep it</button></div></div>`:"";
  return `<div class="stack detail">
    <div class="row" style="justify-content:space-between;align-items:center"><button class="btn icon-btn" data-go="list" type="button">← Job cards</button>${statusPill(c.status)}</div>
    <div><span class="mono" style="color:var(--muted)">${esc(c.jobNo)}</span><h2>${esc(c.customer||"No customer")}${c.site?` · ${esc(c.site)}`:""}</h2></div>
    <div class="row"><button class="btn primary" id="pdfOne" type="button">PDF report</button><button class="btn" id="copyOne" type="button">Copy for WhatsApp</button>${canWrite?`<button class="btn" id="editOne" type="button">Edit</button>`:""}</div>
    <div class="section"><dl class="kv">
      <dt>Date</dt><dd>${fmtDate(c.date)}</dd>
      <dt>Technician</dt><dd>${esc(techName(c.techId))}</dd>
      <dt>Time on site</dt><dd>${esc(c.timeIn||"–")} to ${esc(c.timeOut||"–")}${h!=null?` <span class="mono">(${h} h)</span>`:""}</dd>
      ${c.contact?`<dt>Site contact</dt><dd>${esc(c.contact)}</dd>`:""}
      <dt>Equipment</dt><dd>${esc(c.equipment||"–")}${c.model?` · ${esc(c.model)}`:""}</dd>
      ${c.serial?`<dt>Serial no.</dt><dd class="mono">${esc(c.serial)}</dd>`:""}
      ${c.custRef?`<dt>Order / ref no.</dt><dd class="mono">${esc(c.custRef)}</dd>`:""}
    </dl></div>
    <div class="section stack">${blk("Fault reported",c.fault)}${blk("Work done",c.work)}${c.partsUsed?.length?`<div class="block"><h3>Parts from van</h3><p>${c.partsUsed.map(u=>`${u.qty} × ${esc(u.partNo)} ${esc(u.desc)}`).join("\n")}</p></div>`:""}${blk("Other parts",c.parts)}${blk("Follow-up / notes",c.notes)}${!(c.fault||c.work||c.parts||c.notes||c.partsUsed?.length)?`<p class="hint">No details written yet.</p>`:""}</div>
    ${c.photos?.length?`<div class="section"><div class="block"><h3>Photos</h3></div><div class="gallery">${c.photos.map(p=>`<figure><img ${imgSrc(p.id)} alt="${esc(p.caption||"Job photo")}">${p.caption?`<figcaption>${esc(p.caption)}</figcaption>`:""}</figure>`).join("")}</div></div>`:""}
    ${canWrite?(del||`<div><button class="btn danger" id="delAsk" type="button">Delete job card</button></div>`):""}
  </div>`;
}
function formView(){
  const f=S.form;const opt=(v,l)=>`<option value="${v}" ${f.status===v?"selected":""}>${l}</option>`;
  return `<form id="jobForm" class="stack" novalidate>
    <div class="row" style="justify-content:space-between;align-items:center"><button class="btn icon-btn" id="cancelForm" type="button">Cancel</button><b>${f.id?"Edit job card":"New job card"}</b><button class="btn primary icon-btn" type="submit" id="saveTop">Save</button></div>
    <div class="section"><fieldset><legend>Job</legend>
      <div class="grid2"><label>Job no.<input id="f_jobNo" value="${esc(f.jobNo)}" required></label><label>Date<input id="f_date" type="date" value="${esc(f.date)}"></label></div>

function reportRows(){const r=S.rep;return S.cards.filter(c=>(!r.from||c.date>=r.from)&&(!r.to||c.date<=r.to)&&(r.tech==="all"||c.techId===r.tech)).sort((a,b)=>(a.date||"").localeCompare(b.date||""))}
function setRange(k){const d=new Date();const iso=x=>x.toLocaleDateString("en-CA");let from,to;
  if(k==="today"){from=to=iso(d)}
  else if(k==="month"){from=iso(new Date(d.getFullYear(),d.getMonth(),1));to=iso(d)}
  else{const day=(d.getDay()+6)%7;const mon=new Date(d);mon.setDate(d.getDate()-day);if(k==="lastweek"){mon.setDate(mon.getDate()-7);const sun=new Date(mon);sun.setDate(mon.getDate()+6);from=iso(mon);to=iso(sun)}else{from=iso(mon);to=iso(d)}}
  S.rep.from=from;S.rep.to=to;render()}

function startForm(c){

function readForm(){for(const k of FIELDS){const el=$("#f_"+k);if(el)S.form[k]=el.value.trim()}}
async function compress(file){
  let src;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}
  catch(_){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const w=src.width,h=src.height,s=Math.min(1,1400/Math.max(w,h));
  const cv=document.createElement("canvas");cv.width=Math.round(w*s);cv.height=Math.round(h*s);
  cv.getContext("2d").drawImage(src,0,0,cv.width,cv.height);
  let out=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.78));if(out.size>650000)out=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.6));return out;
}
async function addPhotos(files){
  if(!assets){toast("Photo uploads aren't available for your access level");return}
  readForm();
  for(const file of files){
    const p={preview:URL.createObjectURL(file),caption:"",uploading:true};S.form.photos.push(p);renderPhotos();
    try{const blob=await compress(file);const r=await assets.upload(blob,{type:"image/jpeg"});p.id=r.id;p.url=r.url;p.uploading=false}
    catch(err){const i=S.form?.photos.indexOf(p);if(i>-1)S.form.photos.splice(i,1);toast(err?.code==="too_large"?"That photo is too large":"Photo didn't save. Try again")}
    renderPhotos();
  }
}
async function saveCard(){
  readForm();const f=S.form;
  if(!f.jobNo){toast("Add a job number");$("#f_jobNo").focus();return}
  if(f.photos.some(p=>p.uploading)){toast("Wait for photos to finish saving");return}
  if(!db){toast("Can't reach the job card store. Reopen the app and try again");return}
  const data={};for(const k of FIELDS)data[k]=f[k]||"";
  data.photos=f.photos.filter(p=>p.id).map(p=>({id:p.id,url:p.url||"",caption:p.caption||""}));
  data.partsUsed=(f.partsUsed||[]).map(u=>({partId:u.partId,partNo:u.partNo||"",desc:u.desc||"",qty:+u.qty||0}));
  data.updatedAt=Date.now();
  for(const b of ["#saveTop","#saveBottom"])$(b).disabled=true;
  try{
    if(f.id){data.techId=f.techId||meId||"";data.createdAt=f.createdAt||Date.now();await db.collection("jobcards").doc(f.id).set(data);S.detailId=f.id}
    else{data.techId=meId||"";data.createdAt=Date.now();const ref=await db.collection("jobcards").add(data);S.detailId=ref.id}
    const stockErr=await applyStock(data.techId,f._orig||[],data.partsUsed);
    S.form=null;S.view="detail";S.confirmDel=false;toast(stockErr?"Job card saved, but van stock didn't update. Check Van stock":"Job card saved");render();
  }catch(err){toast(err?.code==="permission_denied"||err?.code==="not_granted"?"You don't have permission to save job cards. Ask the app owner for access":"Didn't save. Check your signal and tap Save again");for(const b of ["#saveTop","#saveBottom"]){const x=$(b);if(x)x.disabled=false}}
}
async function deleteCard(){
  const c=S.cards.find(x=>x.id===S.detailId);
  try{await db.collection("jobcards").doc(S.detailId).delete();if(c?.partsUsed?.length)await applyStock(c.techId,c.partsUsed,[]);S.view="list";toast("Job card deleted");render()}
  catch(_){toast("Couldn't delete. Try again")}
}

async function savePart(){
  const v=id=>$("#"+id).value.trim();const partNo=v("p_partNo");
  if(!partNo){toast("Add a part number");return}

/* ---------- storage ----------
   Everything is saved on the phone first, so the app works with no signal.
   - Local mode (no Firebase config yet): data stays in this phone's IndexedDB.
   - Firebase mode: Firestore's offline cache holds the data on the phone and
     uploads changes to the team as soon as there's signal.
   Both expose the same small API the app uses: collection/doc, add/set/update/delete/get/onSnapshot. */
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(_){return null}};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);

function openIdb(){return new Promise((res,rej)=>{const r=indexedDB.open("bakery-jobcards",1);r.onupgradeneeded=()=>r.result.createObjectStore("docs");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function makeLocalDb(){
  const h=await openIdb();const mem=new Map();const subs=new Set();
  await new Promise((res,rej)=>{const rq=h.transaction("docs").objectStore("docs").openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){mem.set(c.key,c.value);c.continue()}else res()};rq.onerror=()=>rej(rq.error)});
  const persist=(path,val)=>new Promise((res,rej)=>{const tx=h.transaction("docs","readwrite");const st=tx.objectStore("docs");if(val===undefined)st.delete(path);else st.put(val,path);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
  const notify=()=>{for(const f of [...subs]){try{f()}catch(e){console.error(e)}}};
  const clone=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
  const snap=path=>{const d=mem.get(path);return {id:path.split("/").pop(),exists:d!==undefined,data:()=>clone(d)}};
  const docRef=path=>({id:path.split("/").pop(),path,
    async get(){return snap(path)},
    async set(d){const v=clone(d);mem.set(path,v);notify();await persist(path,v)},
    async update(p){const cur=mem.get(path);if(cur===undefined)throw Object.assign(new Error("Not found"),{code:"not-found"});const v={...cur,...clone(p)};mem.set(path,v);notify();await persist(path,v)},
    async delete(){mem.delete(path);notify();await persist(path,undefined)},
    onSnapshot(cb){const f=()=>cb(snap(path));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}});
  const colRef=(path,order)=>{const list=()=>{const out=[];for(const [k,v] of mem){if(k.slice(0,k.lastIndexOf("/"))===path)out.push({id:k.split("/").pop(),exists:true,data:()=>clone(v),_v:v})}
      if(order)out.sort((a,b)=>{const x=a._v[order.f],y=b._v[order.f];return (x>y?1:x<y?-1:0)*(order.d==="desc"?-1:1)});return out};
    return {doc:id=>docRef(path+"/"+(id||newId())),
      async add(d){const r=docRef(path+"/"+newId());await r.set(d);return r},
      orderBy:(f,d)=>colRef(path,{f,d}),
      async get(){return {docs:list()}},
      onSnapshot(cb){const f=()=>cb({docs:list()});subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}}};
  return {collection:p=>colRef(p),doc:p=>docRef(p),entries:()=>[...mem.entries()]};
}

function makeFireDb(fs){
  // Writes land in the phone's offline cache straight away; Firestore uploads them when online.
  // We don't wait for the server, otherwise saving would hang with no signal.
  const bg=p=>{p.catch(err=>{console.warn(err);toast("A change didn't sync ("+(err?.code||"error")+")")});return Promise.resolve()};
  const doc=r=>({id:r.id,path:r.path,
    get:()=>r.get({source:"cache"}).catch(()=>r.get()),
    set:d=>bg(r.set(d)),update:d=>bg(r.update(d)),delete:()=>bg(r.delete()),
    onSnapshot:(a,b)=>r.onSnapshot(a,b)});
  const col=c=>({doc:id=>doc(id?c.doc(id):c.doc()),
    add:async d=>{const r=c.doc();bg(r.set(d));return doc(r)},
    orderBy:(f,d)=>col(c.orderBy(f,d)),
    get:()=>c.get({source:"cache"}).catch(()=>c.get()),
    onSnapshot:(a,b)=>c.onSnapshot(a,b)});
  return {collection:p=>col(fs.collection(p)),doc:p=>doc(fs.doc(p))};
}

const sync={online:navigator.onLine,pending:false};
function showSync(){const el=$("#syncState");if(!el)return;let t,c="";
  if(syncMode!=="firebase"){t="Saved on this phone"}
  else if(!sync.online){t="Offline · saved on phone";c="wait"}
  else if(sync.pending){t="Syncing…";c="wait"}
  else{t="Synced";c="ok"}
  el.textContent=t;el.className="sync "+c}
addEventListener("online",()=>{sync.online=true;showSync();if(syncMode==="firebase"&&!window.firebase.auth().currentUser)window.firebase.auth().signInAnonymously().catch(()=>{})});
addEventListener("offline",()=>{sync.online=false;showSync()});

async function openStore(){
  const local=await makeLocalDb();
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||!window.firebase)return local;
  const fb=window.firebase;fb.initializeApp(cfg);
  const fs=fb.firestore();
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(err){console.warn("Offline cache unavailable",err)}
  fb.auth().signInAnonymously().catch(()=>{}); // remembered on the phone after the first time online
  syncMode="firebase";
  // Job cards made before sync was switched on get uploaded once.
  if(!LS("migrated")){for(const [path,data] of local.entries())fs.doc(path).set(data).catch(()=>{});LS("migrated","1")}
  fs.collection("jobcards").onSnapshot({includeMetadataChanges:true},s=>{sync.pending=s.metadata.hasPendingWrites;showSync()},()=>{});
  return makeFireDb(fs);
}

/* photos and logos: stored as compressed JPEG/PNG data in the "blobs" collection */
const blobCache={};
const toDataUrl=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function uploadBlob(blob){
  const url=await toDataUrl(blob);
  if(url.length>950000)throw {code:"too_large"};
  const ref=db.collection("blobs").doc();await ref.set({data:url,createdAt:Date.now()});
  blobCache[ref.id]=url;return {id:ref.id,url:""};
}
function blobSrc(id){return (id&&blobCache[id])||""}
async function blobUrl(id){
  if(!id)return "";if(blobCache[id])return blobCache[id];
  const s=await db.doc("blobs/"+id).get();const u=s.exists?(s.data().data||""):"";
  if(u)blobCache[id]=u;return u;
}
function hydrate(){document.querySelectorAll("img[data-blob]:not([src])").forEach(im=>{const id=im.dataset.blob;if(!id)return;blobUrl(id).then(u=>{if(u)im.src=u}).catch(()=>{})})}
async function shrinkLogo(file){
  let b;try{b=await createImageBitmap(file)}catch(_){b=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const s=Math.min(1,600/Math.max(b.width,b.height));const cv=document.createElement("canvas");cv.width=Math.round(b.width*s);cv.height=Math.round(b.height*s);
  cv.getContext("2d").drawImage(b,0,0,cv.width,cv.height);
  const png=await new Promise(r=>cv.toBlob(r,"image/png"));if(png.size<600000)return png;
  const c2=document.createElement("canvas");c2.width=cv.width;c2.height=cv.height;const x=c2.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c2.width,c2.height);x.drawImage(cv,0,0);
  return await new Promise(r=>c2.toBlob(r,"image/jpeg",0.9));
}

    <p class="hint">Your name goes on your job cards and reports, and your van stock is kept under it. You can change it later in Settings.</p>
  </fieldset></div>
  <button class="btn primary" type="submit">Start</button></form>`}
function setMyName(n){S.myName=n;LS("techName",n);S.names[meId]=n;if(db)db.doc("techs/"+meId).set({name:n,joined:+LS("joined")||Date.now()}).catch(()=>{})}
function saveWho(){const n=$("#w_name").value.trim();if(!n){toast("Type your name");return}setMyName(n);S.view="list";render()}

/* Android back button */
window.onBack=()=>{
  if(S.view==="form"){S.view=S.form?.id?"detail":"list";S.form=null;render();return true}
  if(S.view==="van"&&S.partForm){S.partForm=null;render();return true}
  if(S.view!=="list"&&S.view!=="who"){S.view="list";render();return true}
  return false;
};

/* ---------- data ---------- */
async function boot(){
  S.myName=LS("techName")||"";
  meId=LS("techId");if(!meId){meId="t-"+newId();LS("techId",meId);LS("joined",String(Date.now()))}
  if(S.myName)S.names[meId]=S.myName;
  if(!S.myName)S.view="who";
  render();showSync();
  try{db=await openStore()}catch(err){console.error(err);S.error="Couldn't open the job card store on this phone. Close the app and open it again.";S.loaded=true;render();return}
  assets={upload:uploadBlob};showSync();
  S.vanTech=meId;subVan(meId);
  if(S.myName)setMyName(S.myName);
  db.collection("techs").onSnapshot(sn=>{S.techs=sn.docs.map(d=>d.id);if(!S.techs.includes(meId))S.techs.push(meId);let ch=false;for(const d of sn.docs){const n=d.data()?.name;if(n&&S.names[d.id]!==n){S.names[d.id]=n;ch=true}}if((ch||S.view==="van")&&S.view!=="form"&&S.view!=="settings"&&S.view!=="who")render()},()=>{});
  const timer=setTimeout(()=>{if(!S.loaded){S.error="Job cards are taking long to load.";render()}},10000);
  db.collection("jobcards").orderBy("createdAt","desc").onSnapshot(snap=>{
    clearTimeout(timer);S.loaded=true;S.error=null;
    S.cards=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(S.view!=="form"&&S.view!=="settings"&&S.view!=="who")render();
  },err=>{console.error(err);clearTimeout(timer);S.loaded=true;S.error="Couldn't load job cards. Close the app and open it again.";if(S.view!=="form")render()});
  db.doc("settings/company").onSnapshot(s=>{const d=s.exists?s.data():{};S.company={name:d.name||"",footer:d.footer||"",logoId:d.logoId||"",logoUrl:"",brandLogos:Array.isArray(d.brandLogos)?d.brandLogos:[]};if(S.view!=="form"&&S.view!=="settings"&&S.view!=="who")render();else{$("#coName").textContent=S.company.name||"Service department";setLogo()}},()=>{});
}
setRange("week");boot();
</script>
